<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>Ankara Robotik Ahşap Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">Ankara Robotik</div>
      <h1>Ahşap Puzzle</h1>
      <p class="sub">Parçaya tıklayın, yerine otursun. Modeli sürükleyerek veya küple çevirin.</p>
    </header>

    <section class="workspace">
      <aside class="rail">
        <div class="rail-head">
          <span>Parçalar</span>
          <strong id="count">—</strong>
        </div>
        <div class="rail-view">
          <canvas id="railCanvas"></canvas>
          <div id="list" class="list"></div>
        </div>
      </aside>

      <section class="stage-wrap">
        <div id="stage"></div>
        <div class="hud">
          <span id="status">Yükleniyor</span>
          <div class="bar"><i id="bar"></i></div>
        </div>
        <div id="toast">Model tamamlandı</div>

        <div class="tools" id="tools">
          <div class="vcube" id="vcube" title="Küpü sürükleyerek modeli çevirin">
            <div class="cube" id="cube">
              <button type="button" class="face front" data-face="front">FRONT</button>
              <button type="button" class="face back" data-face="back">BACK</button>
              <button type="button" class="face right" data-face="right">RIGHT</button>
              <button type="button" class="face left" data-face="left">LEFT</button>
              <button type="button" class="face top" data-face="top">TOP</button>
              <button type="button" class="face bottom" data-face="bottom">BOTTOM</button>
            </div>
          </div>
          <button type="button" class="tool" data-act="home" title="Başlangıç görünümü">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
          </button>
          <button type="button" class="tool" data-act="fit" title="Modele sığdır">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
          </button>
          <button type="button" class="tool" data-act="zin" title="Yakınlaştır">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" class="tool" data-act="zout" title="Uzaklaştır">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button type="button" class="tool" data-act="iso" title="İzometrik görünüm">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9L12 3Z"/><path d="M12 12 20 7.5M12 12v9M12 12 4 7.5"/></svg>
          </button>
          <button type="button" class="tool" data-act="spin" title="Pervaneleri döndür">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12 12 3.5M12 12l7.4 4.9M12 12l-7.4 4.9"/><circle cx="12" cy="12" r="2.2"/></svg>
          </button>
        </div>
      </section>
    </section>

    <p id="hint">Pembe parçaya tıklayın; yerine ilerleyip oturur. Kartın üzerinde sürükleyerek parçayı döndürebilirsiniz.</p>
  </main>

  <div class="assistant" id="assistant">
    <section class="assistant-panel" id="assistantPanel" hidden>
      <header>
        <strong>Builder</strong>
        <span>Proje asistanı</span>
        <button type="button" id="assistantClose" aria-label="Kapat">×</button>
      </header>
      <div class="assistant-log" id="assistantLog"></div>
    </section>
    <button type="button" class="assistant-fab" id="assistantOpen">Builder</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
